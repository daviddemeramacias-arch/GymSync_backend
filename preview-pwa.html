<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GymSync PWA Socio</title>
<style>
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#0f172a;display:grid;place-items:center;min-height:100vh}
  .phone{width:360px;height:720px;background:#fff;border-radius:34px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45);display:flex;flex-direction:column}
  .top{background:#4C5E51;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}
  .top .avatar{width:40px;height:40px;border-radius:50%;background:#F4806A}
  .top h1{margin:0;font-size:16px}.top p{margin:0;font-size:11px;opacity:.8}
  .content{flex:1;padding:16px;background:#F1F5F9;overflow:auto}
  .pass{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .qr{width:160px;height:160px;margin:10px auto;background:#e2e8f0;border-radius:8px;display:grid;place-items:center;font-size:12px;color:#64748b}
  .code{font-size:24px;font-weight:800;color:#4C5E51;letter-spacing:6px;margin:8px 0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .gcard{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .gcard h3{margin:0 0 4px;color:#4C5E51;font-size:13px}
  .gcard .v{font-size:20px;font-weight:800;color:#F4806A}
  .nav{background:#fff;border-top:1px solid #e2e8f0;display:flex;padding:8px 0}
  .nav button{flex:1;border:none;background:transparent;font-size:11px;color:#475569}
  .nav button.active{color:#F4806A;font-weight:700}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div class="avatar"></div>
    <div><h1>Hola, Ana</h1><p>Mensual · Vence 28/11</p></div>
  </div>
  <div class="content">
    <div class="pass">
      <div style="font-weight:700;color:#4C5E51">Tu pase de acceso</div>
      <div class="qr">QR</div>
      <div class="code">4821</div>
      <span style="background:#10B981;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700">Activo</span>
    </div>
    <div class="grid">
      <div class="gcard"><h3>Marketplace</h3><div class="v">Ver catálogo</div></div>
      <div class="gcard"><h3>Rutinas</h3><div class="v">Hoy: Pierna</div></div>
      <div class="gcard"><h3>Pagos</h3><div class="v">$45.00</div></div>
      <div class="gcard"><h3>Historial</h3><div class="v">12 sesiones</div></div>
    </div>
  </div>
  <div class="nav">
    <button class="active">Inicio</button>
    <button>Pase</button>
    <button>Rutinas</button>
    <button>Tienda</button>
    <button>Perfil</button>
  </div>
</div>
</body>
</html>
